# Kartoteka DK — production stack.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reads its secrets from .env next to this file; see .env.production.example.
# Nothing here is provider-specific: any host that runs Docker will do.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # The pl-PL-x-icu collation the migrations rely on needs ICU present.
      LANG: pl_PL.utf8
    # No published port. The database is reachable only from this compose
    # network, so a firewall misconfiguration cannot expose it.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  # One shot per deployment: applies pending migrations and exits. The app
  # waits for it to succeed, so a failed migration keeps the old container
  # running rather than starting a server against a schema it does not expect.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # Not for the migrations themselves — for the scripts run through this
      # same container: `create-superadmin` and `key:reset` print an invitation
      # link built from APP_URL, and without it the link that comes out says
      # localhost. See docs/DEPLOYMENT.md, "Pierwsze konto".
      APP_URL: ${APP_URL}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      APP_URL: ${APP_URL}
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys. Losing this volume means re-issuing
      # certificates, which Let's Encrypt rate-limits.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
