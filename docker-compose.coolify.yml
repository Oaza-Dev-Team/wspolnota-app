# Kartoteka DK — production stack as deployed by Coolify.
#
# Identical to docker-compose.prod.yml except that it carries no proxy: Coolify
# runs its own Traefik, which terminates TLS and routes by hostname. Assign the
# domain to the `app` service in the Coolify UI as
#
#   https://kartoteka.example.pl:3000
#
# The port there is internal addressing — it tells Coolify which service and
# port to route to, and publishes nothing.
#
# docker-compose.prod.yml stays in the repository on purpose. It is the
# self-contained path documented in docs/DEPLOYMENT.md and the way back onto
# any host that runs Docker, so the two files are meant to differ only by the
# proxy.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # The pl-PL-x-icu collation the migrations rely on needs ICU present.
      LANG: pl_PL.utf8
    # No published port. The database is reachable only from this compose
    # network, so a firewall misconfiguration cannot expose it.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  # One shot per deployment: applies pending migrations and exits. The app
  # waits for it to succeed, so a failed migration keeps the old container
  # running rather than starting a server against a schema it does not expect.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # Not for the migrations themselves — for the scripts run through this
      # same container: `create-superadmin` and `key:reset` print an invitation
      # link built from APP_URL, and without it the link that comes out says
      # localhost. See docs/DEPLOYMENT.md, "Pierwsze konto".
      APP_URL: ${APP_URL}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      APP_URL: ${APP_URL}
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  db-data:
